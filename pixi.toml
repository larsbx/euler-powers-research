# Match the pinned Mojo/MAX build used by larsbx/finite-math-kernels.
[workspace]
name = "euler-powers-research"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
modular = "==26.6.0.dev2026090805"
mojo = "==1.1.0.dev2026090805"
mojo-compiler = "==1.1.0.dev2026090805"
python = ">=3.11,<3.14"

[tasks]
verify-mojo = "bash scripts/verify_mojo.sh"
verify-reference = "python tests/verify_known_solutions.py"
verify = { depends-on = ["verify-mojo", "verify-reference"] }
residue-sieve = "bash scripts/run_mojo.sh kernel/residue_sieve.mojo"
census-144 = "bash scripts/run_mojo.sh kernel/positive_census.mojo 144"
census-shard-a = "bash scripts/run_mojo.sh kernel/positive_census.mojo 2 72"
census-shard-b = "bash scripts/run_mojo.sh kernel/positive_census.mojo 73 144"
verify-research = "python tests/check_research_kernels.py"
pair-index-conformance = "python tests/test_pair_index_conformance.py"
