# Temporary, branch-scoped bootstrap. Delete this workflow after lock creation.
name: Bootstrap pinned Pixi lockfile
on:
  push:
    branches: [research/mojo-shards-and-toolchain-lock]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
      - name: Resolve and commit transitive lock
        shell: bash
        run: |
          set -euo pipefail
          pixi lock
          test -s pixi.lock
          git add pixi.lock
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: freeze Pixi dependencies resolved by CI'
          git push origin HEAD:refs/heads/research/mojo-shards-and-toolchain-lock
