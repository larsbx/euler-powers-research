name: Verify Mojo exact arithmetic

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mojo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
      - name: Exact-arithmetic verification (Mojo + Python reference)
        run: pixi run --locked verify && pixi run --locked verify-research
      - name: Same-run pinned Mojo comparison (archived P2 vs packed P3)
        run: pixi run --locked python tests/benchmark_pair_index.py --output benchmarks/results/native-comparison.json
      - name: Native same-run digit/CRT filter comparison
        run: pixi run --locked python tests/benchmark_digit_filter.py --output benchmarks/results/digit-filter-comparison.json
      - name: Preserve digit/CRT benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: native-digit-filter-benchmark
          path: benchmarks/results/digit-filter-comparison.json
          if-no-files-found: error
          retention-days: 30
      - name: High-precision 2475 vs 99000 native comparison
        run: pixi run --locked python tests/benchmark_modulus_selection.py --output benchmarks/results/modulus-selection.json
      - name: Preserve modulus-selection benchmark
        uses: actions/upload-artifact@v4
        with:
          name: native-modulus-selection
          path: benchmarks/results/modulus-selection.json
          if-no-files-found: error
          retention-days: 30
      - name: Execute gap-free BigZ shards 2..12 and independent replay
        run: |
          pixi run --locked python tools/bigz_shard_plan.py execute --bound 12 --width 4 --modulus 35 --timeout 60 --ram-mib 4096 --output benchmarks/results/bigz-shards-b12
          pixi run --locked python tools/bigz_shard_plan.py verify --output benchmarks/results/bigz-shards-b12
          pixi run --locked python tests/test_bigz_plan_native.py
      - name: Preserve accepted BigZ B12 shards and scope receipts
        uses: actions/upload-artifact@v4
        with:
          name: exact-bigz-height-shards-B12
          path: benchmarks/results/bigz-shards-b12
          if-no-files-found: error
          retention-days: 30
      - name: Execute all BigZ shards through height 144
        run: |
          /usr/bin/time -v -o benchmarks/results/bigz-b144-resource.txt \
            pixi run --locked python tools/bigz_shard_plan.py execute \
            --bound 144 --width 4 --modulus 35 --timeout 60 \
            --ram-mib 4096 --max-bytes 1048576 \
            --output benchmarks/results/bigz-shards-b144
          pixi run --locked python tools/bigz_shard_plan.py verify \
            --output benchmarks/results/bigz-shards-b144
          pixi run --locked python tests/reconcile_bigz_b144.py \
            benchmarks/results/bigz-shards-b144 \
            --output benchmarks/results/bigz-b144-crosscheck.json
      - name: Preserve complete BigZ B144 Mojo transcripts and crosscheck
        uses: actions/upload-artifact@v4
        with:
          name: exact-bigz-height-shards-B144
          path: |
            benchmarks/results/bigz-shards-b144/
            benchmarks/results/bigz-b144-crosscheck.json
            benchmarks/results/bigz-b144-resource.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve raw benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: native-pair-index-benchmark
          path: benchmarks/results/native-comparison.json
          if-no-files-found: error
          retention-days: 30
